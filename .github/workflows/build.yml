name: Build Tax Checker App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download RapidOCR Models
      run: |
        New-Item -ItemType Directory -Force -Path models | Out-Null
        curl -L -o models/en_PP-OCRv3_det_infer.onnx "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.4.0/onnx/PP-OCRv4/det/en_PP-OCRv3_det_infer.onnx"
        curl -L -o models/en_PP-OCRv4_rec_infer.onnx "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.4.0/onnx/PP-OCRv4/rec/en_PP-OCRv4_rec_infer.onnx"
        Write-Host "RapidOCR models downloaded successfully"

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm TaxChecker.spec

    - name: Verify bundle contents
      run: |
        Write-Host "Checking bundle contents..."
        Get-ChildItem -Recurse dist/TaxChecker | Select-Object FullName | Where-Object { $_.FullName -match "models" }

    - name: Zip Windows App
      run: |
        Compress-Archive -Path dist/TaxChecker -DestinationPath dist/TaxChecker-Windows.zip

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TaxChecker-Windows
        path: dist/TaxChecker-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Install Homebrew OpenSSL
      run: |
        brew install openssl@3

    - name: Download RapidOCR Models
      run: |
        mkdir -p models
        curl -L -o models/en_PP-OCRv3_det_infer.onnx "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.4.0/onnx/PP-OCRv4/det/en_PP-OCRv3_det_infer.onnx"
        curl -L -o models/en_PP-OCRv4_rec_infer.onnx "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.4.0/onnx/PP-OCRv4/rec/en_PP-OCRv4_rec_infer.onnx"
        echo "RapidOCR models downloaded successfully"

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm TaxChecker.spec

    - name: Fix SSL Libraries (replace dangling symlinks)
      run: |
        # PyInstaller creates symlinks to cv2 SSL libs which we excluded
        # Replace them with actual Homebrew OpenSSL files
        FRAMEWORKS="dist/TaxChecker.app/Contents/Frameworks"
        SSL_PATH="/opt/homebrew/opt/openssl@3/lib"
        
        # Remove dangling symlinks
        rm -f "$FRAMEWORKS/libssl.3.dylib" "$FRAMEWORKS/libcrypto.3.dylib" 2>/dev/null || true
        
        # Copy actual files  
        if [ -f "$SSL_PATH/libssl.3.dylib" ]; then
          cp "$SSL_PATH/libssl.3.dylib" "$FRAMEWORKS/"
          cp "$SSL_PATH/libcrypto.3.dylib" "$FRAMEWORKS/"
          echo "✅ Replaced SSL symlinks with Homebrew OpenSSL"
        else
          echo "⚠️ Homebrew OpenSSL not found at $SSL_PATH"
        fi

    - name: Verify bundle contents
      run: |
        echo "Checking bundle contents..."
        find dist/TaxChecker.app -name "*models*" 2>/dev/null || true

    - name: Zip macOS App
      run: |
        cd dist
        zip -r TaxChecker-macOS.zip TaxChecker.app

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TaxChecker-macOS
        path: dist/TaxChecker-macOS.zip
