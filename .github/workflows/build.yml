name: Build Tax Checker App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller pyinstaller-hooks-contrib

    - name: Download RapidOCR English Models
      run: |
        New-Item -ItemType Directory -Force -Path models | Out-Null
        curl -L -o models/en_PP-OCRv3_det_infer.onnx "https://huggingface.co/SWHL/RapidOCR/resolve/main/PP-OCRv4/en_PP-OCRv3_det_infer.onnx"
        curl -L -o models/en_PP-OCRv3_rec_infer.onnx "https://huggingface.co/SWHL/RapidOCR/resolve/main/PP-OCRv3/en_PP-OCRv3_rec_infer.onnx"
        Write-Host "RapidOCR English models downloaded successfully"

    - name: Download Chrome for Testing
      run: |
        New-Item -ItemType Directory -Force -Path bin | Out-Null
        # Download Chrome for Testing
        curl -L -o chrome-win64.zip "https://storage.googleapis.com/chrome-for-testing-public/143.0.7499.146/win64/chrome-win64.zip"
        Expand-Archive -Path chrome-win64.zip -DestinationPath bin -Force
        Remove-Item chrome-win64.zip
        # Download ChromeDriver
        curl -L -o chromedriver-win64.zip "https://storage.googleapis.com/chrome-for-testing-public/143.0.7499.146/win64/chromedriver-win64.zip"
        Expand-Archive -Path chromedriver-win64.zip -DestinationPath temp-driver -Force
        Move-Item -Path temp-driver/chromedriver-win64/chromedriver.exe -Destination bin/chromedriver.exe
        Remove-Item -Recurse -Force temp-driver, chromedriver-win64.zip
        Write-Host "Chrome for Testing and ChromeDriver downloaded successfully"

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm TaxChecker.spec

    - name: Verify bundle contents
      run: |
        Write-Host "Checking bundle contents..."
        Get-ChildItem -Recurse dist/TaxChecker/_internal | Where-Object { $_.FullName -match "models|bin" } | Select-Object FullName
        Test-Path dist/TaxChecker/_internal/bin/chrome-win64/chrome.exe
        Test-Path dist/TaxChecker/_internal/bin/chromedriver.exe

    - name: Zip Windows App
      run: |
        Compress-Archive -Path dist/TaxChecker -DestinationPath dist/TaxChecker-Windows.zip

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TaxChecker-Windows
        path: dist/TaxChecker-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller pyinstaller-hooks-contrib

    - name: Install Homebrew OpenSSL
      run: |
        brew install openssl@3

    - name: Download RapidOCR English Models
      run: |
        mkdir -p models
        curl -L -o models/en_PP-OCRv3_det_infer.onnx "https://huggingface.co/SWHL/RapidOCR/resolve/main/PP-OCRv4/en_PP-OCRv3_det_infer.onnx"
        curl -L -o models/en_PP-OCRv3_rec_infer.onnx "https://huggingface.co/SWHL/RapidOCR/resolve/main/PP-OCRv3/en_PP-OCRv3_rec_infer.onnx"
        echo "RapidOCR English models downloaded successfully"

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm TaxChecker.spec

    - name: Fix SSL Libraries (replace dangling symlinks)
      run: |
        # PyInstaller creates symlinks to cv2 SSL libs which we excluded
        # Replace them with actual Homebrew OpenSSL files
        FRAMEWORKS="dist/TaxChecker.app/Contents/Frameworks"
        SSL_PATH="/opt/homebrew/opt/openssl@3/lib"
        
        # Remove dangling symlinks
        rm -f "$FRAMEWORKS/libssl.3.dylib" "$FRAMEWORKS/libcrypto.3.dylib" 2>/dev/null || true
        
        # Copy actual files  
        if [ -f "$SSL_PATH/libssl.3.dylib" ]; then
          cp "$SSL_PATH/libssl.3.dylib" "$FRAMEWORKS/"
          cp "$SSL_PATH/libcrypto.3.dylib" "$FRAMEWORKS/"
          echo "✅ Replaced SSL symlinks with Homebrew OpenSSL"
        else
          echo "⚠️ Homebrew OpenSSL not found at $SSL_PATH"
        fi

    - name: Verify bundle contents
      run: |
        echo "Checking bundle contents..."
        find dist/TaxChecker.app -name "*models*" 2>/dev/null || true

    - name: Zip macOS App
      run: |
        cd dist
        zip -r TaxChecker-macOS.zip TaxChecker.app

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TaxChecker-macOS
        path: dist/TaxChecker-macOS.zip
