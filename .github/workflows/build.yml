name: Build Tax Checker App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CHROMEDRIVER_VERSION: "131.0.6778.85"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download EasyOCR Models
      run: |
        New-Item -ItemType Directory -Force -Path easyocr_models | Out-Null
        curl -L -o easyocr_models/english_g2.pth "https://huggingface.co/xiaoyao9184/easyocr/resolve/main/english_g2.pth"
        curl -L -o easyocr_models/craft_mlt_25k.pth "https://huggingface.co/xiaoyao9184/easyocr/resolve/main/craft_mlt_25k.pth"
        Write-Host "EasyOCR models downloaded successfully"

    - name: Download ChromeDriver
      run: |
        New-Item -ItemType Directory -Force -Path chromedriver/windows | Out-Null
        curl -L -o chromedriver-win.zip "https://storage.googleapis.com/chrome-for-testing-public/${{ env.CHROMEDRIVER_VERSION }}/win64/chromedriver-win64.zip"
        Expand-Archive -Path chromedriver-win.zip -DestinationPath chromedriver-temp -Force
        Move-Item chromedriver-temp/chromedriver-win64/chromedriver.exe chromedriver/windows/ -Force
        Remove-Item -Recurse -Force chromedriver-temp, chromedriver-win.zip
        Write-Host "ChromeDriver downloaded successfully"

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm TaxChecker.spec

    - name: Verify bundle contents
      run: |
        Write-Host "Checking bundle contents..."
        Get-ChildItem -Recurse dist/TaxChecker | Select-Object FullName | Where-Object { $_.FullName -match "chromedriver|easyocr" }

    - name: Zip Windows App
      run: |
        Compress-Archive -Path dist/TaxChecker -DestinationPath dist/TaxChecker-Windows.zip

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TaxChecker-Windows
        path: dist/TaxChecker-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download EasyOCR Models
      run: |
        mkdir -p easyocr_models
        curl -L -o easyocr_models/english_g2.pth "https://huggingface.co/xiaoyao9184/easyocr/resolve/main/english_g2.pth"
        curl -L -o easyocr_models/craft_mlt_25k.pth "https://huggingface.co/xiaoyao9184/easyocr/resolve/main/craft_mlt_25k.pth"
        echo "EasyOCR models downloaded successfully"

    - name: Download ChromeDriver
      run: |
        mkdir -p chromedriver/macos
        curl -L -o chromedriver-mac.zip "https://storage.googleapis.com/chrome-for-testing-public/${{ env.CHROMEDRIVER_VERSION }}/mac-arm64/chromedriver-mac-arm64.zip"
        unzip -o -j chromedriver-mac.zip "chromedriver-mac-arm64/chromedriver" -d chromedriver/macos/
        chmod +x chromedriver/macos/chromedriver
        rm chromedriver-mac.zip
        echo "ChromeDriver downloaded successfully"

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm TaxChecker.spec

    - name: Verify bundle contents
      run: |
        echo "Checking bundle contents..."
        find dist/TaxChecker.app -name "*chromedriver*" -o -name "*easyocr*" 2>/dev/null || true

    - name: Zip macOS App
      run: |
        cd dist
        zip -r TaxChecker-macOS.zip TaxChecker.app

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TaxChecker-macOS
        path: dist/TaxChecker-macOS.zip
